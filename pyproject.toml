[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peaceful-poker"
version = "0.1.0"
description = "Educational No-Limit Texas Hold'em decision trainer."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Peaceful Poker Contributors" }]
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "ruff>=0.5",
]

[project.scripts]
peaceful-poker = "poker_trainer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["poker_trainer"]
